domain_standard:
  declared: false
  note: >-
    REWARD-ONLY AND HONESTLY EMPTY. Sift's market — mission-critical hardware telemetry for aerospace,
    defense, energy, robotics and autonomous vehicles — has no single interchange standard that a contract
    can declare the way a health API declares FHIR or an identity API declares a SCIM schema URN. Nothing in
    the contract or the docs declares CCSDS, MCAP, Sparkplug, OPC UA, ASAM ODS or any comparable domain
    schema, and none was invented to fill the slot. What Sift does implement instead is a set of adjacent
    format and expression standards — ULog, TDMS, HDF5, Parquet, InfluxDB line protocol, MQTT, Protocol
    Buffers, CEL — recorded above under data_format_standards and api_standards.
  probed_for: [ccsds, mcap, sparkplug, opc-ua, asam-ods, ros-bag, iso-20022, scim, odata, openrtb, activitypub, oai-pmh]
  probe_note: 'Full-text search across the entire documentation corpus via the provider''s own docs MCP returned no hit for CCSDS, MCAP or Sparkplug.'
