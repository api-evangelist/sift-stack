name: Sift client libraries and distributions
note: >-
  Sift ships every first-party client from one MIT-licensed monorepo, github.com/sift-stack/sift, with
  language subtrees (python/, rust/, go/, cpp/) generated from the protos/ directory. Only the Python and
  Rust clients are published to a package registry; the Go client is consumed as a Go module and the C++
  client is source-only. The CLI is distributed as prebuilt binaries from GitHub Releases via a
  cargo-dist installer script, not from crates.io.
