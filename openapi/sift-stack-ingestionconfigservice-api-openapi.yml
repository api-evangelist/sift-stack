openapi: 3.2.0
info:
  title: Sift Ingestion Config Service API
  version: '1.0'
  description: Service to programmatically interact with [ingestion configs](/glossary#ingestion-config).
servers:
- url: https://api.siftstack.com
  description: Production
- url: https://gov.api.siftstack.com
  description: Gov
security:
- BearerAuth: []
tags:
- name: IngestionConfigService
  description: Service to programmatically interact with [ingestion configs](/glossary#ingestion-config).
  externalDocs:
    description: Read more about what ingestion configs are.
    url: /ingestion/creating-amend-ingestion-config
paths:
  /api/v1/ingestion-configs:
    get:
      summary: ListIngestionConfigs
      description: List ingestion configs using an optional filter.
      operationId: IngestionConfigService_ListIngestionConfigs
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv1ListIngestionConfigsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: pageSize
        description: 'The maximum number of ingestion configs to return. The service may return fewer than this value.

          If unspecified, at most 50 ingestion configs will be returned. The maximum value is 1000; values above

          1000 will be coerced to 1000. Optional.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageToken
        description: 'A page token, received from a previous `ListIngestionConfigs` call.

          Provide this to retrieve the subsequent page.

          When paginating, all other parameters provided to `ListIngestionConfigs` must match

          the call that provided the page token. Optional.'
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'A [Common Expression Language (CEL)](https://github.com/google/cel-spec) filter string.

          Available fields to filter by are `ingestion_config_id`, `client_key`, `asset_id`, `created_date`, and `modified_date`.

          For further information about how to use CELs, please refer to [this guide](https://github.com/google/cel-spec/blob/master/doc/langdef.md#standard-definitions).'
        in: query
        required: false
        schema:
          type: string
      tags:
      - IngestionConfigService
    post:
      summary: CreateIngestionConfig
      description: Create an ingestion config.
      operationId: IngestionConfigService_CreateIngestionConfig
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv1CreateIngestionConfigResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ingestion_configsv1CreateIngestionConfigRequest'
        description: The request for a call to `IngestionConfigService_CreateIngestionConfig` to create an ingestion configs.
        required: true
      tags:
      - IngestionConfigService
  /api/v1/ingestion-configs/{ingestionConfigId}:
    get:
      summary: GetIngestionConfig
      description: Retrieves an ingestion config.
      operationId: IngestionConfigService_GetIngestionConfig
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv1GetIngestionConfigResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ingestionConfigId
        in: path
        required: true
        schema:
          type: string
      tags:
      - IngestionConfigService
  /api/v1/ingestion-configs/{ingestionConfigId}/flows:
    get:
      summary: ListIngestionConfigFlows
      description: List ingestion config flows using an optional filter.
      operationId: IngestionConfigService_ListIngestionConfigFlows
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv1ListIngestionConfigFlowsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ingestionConfigId
        in: path
        required: true
        schema:
          type: string
      - name: pageSize
        description: 'The maximum number of ingestion config flows to return. The service may return fewer than this value.

          If unspecified, at most 50 ingestion config flows will be returned. The maximum value is 1000; values above

          1000 will be coerced to 1000. Optional.'
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: pageToken
        description: 'A page token, received from a previous `ListIngestionConfigFlows` call.

          Provide this to retrieve the subsequent page.

          When paginating, all other parameters provided to `ListIngestionConfigFlows` must match

          the call that provided the page token. Optional.'
        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'A [Common Expression Language (CEL)](https://github.com/google/cel-spec) filter string.

          Available fields to filter by are `flow_name`, `flow_id`, `created_date`, and `modified_date`.

          For further information about how to use CELs, please refer to [this guide](https://github.com/google/cel-spec/blob/master/doc/langdef.md#standard-definitions).'
        in: query
        required: false
        schema:
          type: string
      tags:
      - IngestionConfigService
    post:
      summary: CreateIngestionConfigFlows
      description: Create ingestion config flows.
      operationId: IngestionConfigService_CreateIngestionConfigFlows
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv1CreateIngestionConfigFlowsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ingestionConfigId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                flows:
                  type: array
                  items:
                    $ref: '#/components/schemas/ingestion_configsv1FlowConfig'
                  description: These flows must have unique names. If you try to send a flow with a name that already exists for an ingestion config, it will return an error.
              description: The request for a call to `IngestionConfigService_CreateIngestionConfigFlows` to create ingestion config flows.
        required: true
      tags:
      - IngestionConfigService
  /api/v2/ingestion-configs:
    get:
      summary: ListIngestionConfigs
      description: List ingestion configs using an optional filter.
      operationId: IngestionConfigService_ListIngestionConfigsV2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv2ListIngestionConfigsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
