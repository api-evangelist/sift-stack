                  items:
                    $ref: '#/components/schemas/ingestion_configsv2FlowConfig'
                  description: These flows must have unique names. If you try to send a flow with a name that already exists for an ingestion config, it will return an error.
              description: The request for a call to `IngestionConfigService_CreateIngestionConfigFlows` to create ingestion config flows.
