        in: query
        required: false
        schema:
          type: string
      - name: filter
        description: 'A [Common Expression Language (CEL)](https://github.com/google/cel-spec) filter string.

          Available fields to filter by are `ingestion_config_id`, `client_key`, `asset_id`, `created_date`, and `modified_date`.

          For further information about how to use CELs, please refer to [this guide](https://github.com/google/cel-spec/blob/master/doc/langdef.md#standard-definitions).'
        in: query
        required: false
        schema:
          type: string
      tags:
      - IngestionConfigService
    post:
      summary: CreateIngestionConfig
      description: Create an ingestion config.
      operationId: IngestionConfigService_CreateIngestionConfigV2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv2CreateIngestionConfigResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ingestion_configsv2CreateIngestionConfigRequest'
        description: The request for a call to `IngestionConfigService_CreateIngestionConfig` to retrieve ingestion configs.
        required: true
      tags:
      - IngestionConfigService
  /api/v2/ingestion-configs/{ingestionConfigId}:
    get:
      summary: GetIngestionConfig
      description: Retrieves an ingestion config.
      operationId: IngestionConfigService_GetIngestionConfigV2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv2GetIngestionConfigResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ingestionConfigId
        in: path
        required: true
        schema:
          type: string
      tags:
      - IngestionConfigService
  /api/v2/ingestion-configs/{ingestionConfigId}/flows:
    get:
      summary: ListIngestionConfigFlows
      description: List ingestion config flows using an optional filter.
      operationId: IngestionConfigService_ListIngestionConfigFlowsV2
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingestion_configsv2ListIngestionConfigFlowsResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rpcStatus'
      parameters:
      - name: ingestionConfigId
        in: path
        required: true
        schema:
          type: string
      - name: pageSize
        description: 'The maximum number of ingestion config flows to return. The service may return fewer than this value.

          If unspecified, at most 50 ingestion config flows will be returned. The maximum value is 1000; values above

          1000 will be coerced to 1000. Optional.'
        in: query
        required: false
        schema:
          type: integer
