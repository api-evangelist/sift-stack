name: Sift data model
note: 'Sift''s core model is small and stable: an ASSET is the system under test, a CHANNEL is one signal from it,
  a RUN is a captured session, and everything else hangs off those three. RULE (a CEL expression) evaluated against
  a RUN yields a REPORT; a firing rule opens an ANNOTATION; a CAMPAIGN groups reports across runs; a FAMILY is a
  named set of known-good runs used as a comparison baseline; a CALCULATED CHANNEL is a derived signal. Relationships
  below are read from id-reference fields and $ref arrays in the spec, so they are structural rather than declared
  — the spec has no foreign-key vocabulary.'
organization_scoping: Most top-level entities carry organizationId; the API key resolves to one organization, and
  organizationId is required on requests only when the user belongs to more than one.
identity:
  server_ids: Opaque string ids, no type prefix (unlike Stripe-style prefixed ids) — an id alone does not tell a
    client what it points at.
  client_keys: Rules, Calculated Channels, Families, Campaigns and Runs additionally accept a client-supplied `client_key`,
    immutable after creation, and several operations resolve by it instead of by server id.
