ingestion_errors:
  surface: dead-letter queue
  operationId: DlqErrorsService_ListDlqErrorsV2
  path: GET /api/v2/dlq-errors
  schemas: [v2ErrorSummary, v2ListDlqErrorsResponse, v2UlogParseErrorPolicy]
  docs: https://docs.siftstack.com/documentation/manage/identify-and-recover-failed-ingestion-data
  note: >-
    Rows Sift cannot parse during ingestion do not fail the request — they land in a per-organisation dead-letter
    queue. This is the most important error surface for an agent doing ingest work, because a successful import
    job does not by itself mean every row landed.
