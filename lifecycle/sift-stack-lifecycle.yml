  http_status: 404
  note: 'Jira Service Management portal named in https://github.com/sift-stack/sift SECURITY.md as the
    destination for bug and vulnerability reports. Verified 2026-08-27: it returns a real 404 to anonymous
    callers at every path including the host root, so it is customer-only. Sift publishes no public support
    or contact page anywhere in its 172-URL sitemap — the only public routes in are the weekly demo signup
    and the GitHub repositories. The Support pointer was therefore removed from apis.yml rather than left
    asserting a page the public cannot reach.'
