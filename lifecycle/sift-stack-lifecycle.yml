versioning:
  scheme: path-per-service
  policy_published: false
  note: Versions are carried in the path and are per-service (v1, v2, v3 coexist across the same API).
    Sift publishes no written API versioning policy, no stated support window per version, and no migration
    guide for moving between service versions — the versions are simply present in the reference. Client
    libraries version independently (Python 0.20.0, Rust 0.11.0, CLI 0.4.4, Go v0.4.0).
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  mechanism: in-spec field/enum notes
  note: 'There is no deprecation policy page, no RFC 8594 Sunset/Deprecation header, and no announced
    end-of-life dates. Deprecation is signalled inside the contract itself, in field and enum descriptions,
    and only for fields — no operation in the spec carries `deprecated: true`. This is a real but weak
    signal: a client only learns a field is going away by reading the description of the field it is already
    using.'
  examples:
  - location: CalculatedChannelConfig / rules[].conditions[].expression.singleChannelComparison
    text: Deprecated - use CalculatedChannelConfig.
  - location: rules[].contextualChannels.channels[].component
    text: Deprecated - use name instead. If provided, name will be joined with the component as `component.name`.
  - location: ListResolvedCalculatedChannels / ResolveCalculatedChannel / ValidateExpression
    text: This is deprecated and should be passed in expression_channel_references instead.
  - location: ApiKeyService_CreateApiKey
    text: existing clients and may be marked deprecated in a future revision.
  forward_compatibility_note: The contract does state a forward-compatibility convention on enums — new
    enum values may be added "without a breaking change", and the reference repeats an "…breaking changes."
    caution on 300+ operation pages. Clients must treat unknown enum values as tolerable rather than fatal.
  deprecated_operations: 0
