x-pointer-verification:
  checked: '2026-08-27'
  method: Every common[] and properties[] URL fetched with a browser User-Agent; body read, not just the
    status code.
  live: 21
  dead_removed: 1
  repo_files: 28
  removed:
  - type: Support
    url: https://customer.support.siftstack.com/servicedesk/customer/portal/2
    status: 404
    reason: The Jira Service Management portal named in the provider's own SECURITY.md returns a real
      404 ("Atlassian Cloud Notifications - Page Unavailable") to anonymous callers at every path, including
      the host root and /servicedesk/customer/portals. It is a customer-only portal, not a public support
      channel, and Sift publishes no public contact or support page anywhere in its 172-URL sitemap. Removed
      rather than left as a claim we make on Sift's behalf; recorded here and in lifecycle/sift-stack-lifecycle.yml
      so the finding is not lost.
  pointers_withheld:
  - type: Idempotency
    reason: conventions/sift-stack-conventions.yml records idempotency.supported=false — no Idempotency-Key
      header, no replay window, no stated replay semantics. client_key is an immutable external key, not
      an idempotency token. Emitting the pointer would claim a 9-point agent-readiness capability Sift
      does not ship.
  - type: Deprecation
    reason: lifecycle/sift-stack-lifecycle.yml records policy_published=false — no deprecation policy
      page, no RFC 8594 Sunset/Deprecation headers, no operation marked deprecated. Deprecation appears
      only inside field descriptions.
  - type: Pricing
    reason: plans/sift-stack-plans-pricing.yml records plan_count=0 — /pricing is a 404 and the 172-URL
      sitemap contains no pricing page. Sales-led enterprise motion.
  - type: AsyncAPI
    reason: No AsyncAPI document is published. The webhook surface is captured as type Webhooks instead;
      the gRPC streaming surface is captured as Protobuf.
  - type: SecurityTxt
    reason: /.well-known/security.txt returned 404 on docs.siftstack.com and www.siftstack.com. The disclosure
      policy lives in a GitHub SECURITY.md, captured under type Security.
  - type: Sandbox
    reason: No sandbox, test environment, test credentials or magic test identifiers are documented. app.siftstack.com
      is a customer login, not a console/playground.
  - type: Roadmap
    reason: No public roadmap page was found on siftstack.com or docs.siftstack.com.
  - type: Postman
    reason: No public Postman collection or workspace was found.
  - type: OAuthScopes
    reason: The API has no OAuth flow and no scopes — one http/bearer securityScheme. scopes/ deliberately
      not emitted; authentication/ carries the model.
  - type: DeclineCodes
    reason: Not a payments or authorization provider.
