aid: sift-stack
name: Sift Stack
description: 'Sift (siftstack.com) is a unified observability platform for mission-critical hardware —
  the telemetry layer for rockets, aircraft, robots, energy systems and autonomous vehicles. Founded by
  former SpaceX engineers Austin Spiegel and Karthik Gollapudi and headquartered in Marina del Rey, California,
  Sift ingests, stores and analyzes high-rate, high-cardinality sensor data, then layers automated rule-based
  anomaly detection, run-to-run comparison and certification-ready reporting on top of it. The product
  surface is unusually complete for a company this size: a 343-operation REST API transcoded from 330
  gRPC RPCs across 66 MIT-licensed .proto files, first-party Python, Rust, Go, C++ and LabVIEW clients,
  a sift-cli binary, outbound HMAC-signed webhooks, and a Grafana datasource. It is also one of the more
  agent-ready providers in the catalog — it publishes an A2A agent card, an Agent Skill, llms.txt on two
  hosts, an anonymous remote MCP documentation server, and a second MCP server that ships inside the CLI
  and talks to a customer''s own Sift environment. Deployment spans SaaS, private cloud, on-premises,
  airgapped and AWS GovCloud, backed by SOC 2 Type II, NIST SP 800-171 and ITAR compliance.'
