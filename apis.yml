apis:
- name: Sift API
  description: The Sift REST API — 343 operations across 46 services covering assets, channels, runs,
    ingestion configs, data imports, rules, rule evaluation, reports, annotations, campaigns, families,
    calculated channels, exports, webhooks, jobs, metadata and governance. It is a grpc-gateway transcoding
    of the gRPC contract, so paths carry Google-AIP custom verbs and errors are google.rpc.Status shaped.
    Authentication is a user-associated API key sent as a bearer token; lists use pageSize/pageToken with
    CEL filters.
  humanURL: https://docs.siftstack.com/api/overview
  baseURL: https://api.siftstack.com
