- name: Sift gRPC API
  description: The gRPC contract that is Sift's primary API — 51 services and 330 RPCs defined across
    66 proto3 files published under MIT in the sift-stack/sift monorepo, including the bidirectional streaming
    ingest path (sift.ingest.v1) that the REST transcoding cannot express. Every first-party client library
    is generated from these definitions.
  humanURL: https://docs.siftstack.com/api/reference/protocol-buffers
  baseURL: https://api.siftstack.com
  tags:
  - gRPC
  - Protobuf
  - Streaming
  - Telemetry
  properties:
  - type: Protobuf
    url: grpc/sift-stack-grpc-index.yml
  - type: SourceCode
    url: https://github.com/sift-stack/sift/tree/main/protos
  - type: Documentation
    url: https://docs.siftstack.com/api/clients
- name: Sift MCP Server
  description: Two Model Context Protocol servers. A public, anonymous remote server at https://docs.siftstack.com/mcp
    exposing search and a virtualized read-only docs filesystem, advertised at /.well-known/mcp.json.
    And the product server, which runs locally over stdio from the sift-cli binary (`sift-cli mcp`), authenticates
    with an API key and reaches a customer's own Sift environment — read-only by default with mutating
    tools gated behind --allow-destructive.
  humanURL: https://docs.siftstack.com/documentation/cli/sift-mcp
  baseURL: https://docs.siftstack.com/mcp
  tags:
  - MCP
  - Agents
  - AI
  properties:
  - type: MCPServer
    url: mcp/sift-stack-mcp.yml
  - type: ToolCrosswalk
    url: mcp/sift-stack-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.siftstack.com/documentation/cli/sift-mcp
